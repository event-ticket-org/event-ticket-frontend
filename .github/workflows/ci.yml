name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Types are generated from the vendored contract on every one of these, so a
      # contract the code no longer matches fails here rather than in front of a user.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
